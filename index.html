<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portfolio</title>
<meta name="description" content="Portfolio: image editing, motion graphics, 3D models and AI automation.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Sora:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<!-- All content (profile, sections, projects) lives in data/portfolio-data.js -->
<script>document.write('<script src="data/portfolio-data.js?v=' + Date.now() + '"><\/script>');</script>
<script>
  (function () {
    var t = null; try { t = localStorage.getItem('pf-theme'); } catch (e) {}
    t = t || ((window.PORTFOLIO || {}).config || {}).defaultTheme || 'dark';
    document.documentElement.dataset.theme = t;
  })();
</script>
</head>
<body>
  <header class="header">
    <div class="wrap">
      <a class="logo" href="#/" id="logo"></a>
      <nav class="top-nav" id="topNav" aria-label="Sections"></nav>
      <div class="header-tools">
        <label class="search" id="searchBox">
          <span class="sr-only">Search projects</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="q" type="search" placeholder="Search projects">
        </label>
        <button class="icon-btn" id="searchBtn" aria-label="Search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        </button>
        <button class="icon-btn theme-toggle" id="themeBtn" aria-label="Switch day or night mode">
          <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
        <a class="btn btn-primary" id="hireTop" href="#/about">Hire me</a>
      </div>
    </div>
  </header>

  <div class="banner" id="banner" role="img" aria-label="Profile banner"></div>
  <div class="wrap">
    <section class="profile" id="profile"></section>
  </div>

  <div class="tabs-bar">
    <div class="wrap"><nav class="tabs" id="tabs" aria-label="Portfolio sections"></nav></div>
  </div>

  <main class="wrap" id="main"></main>

  <footer class="footer"><div class="wrap"><span id="footText"></span><span id="footLinks"></span></div></footer>

  <div class="viewer" id="viewer" hidden role="dialog" aria-modal="true" aria-labelledby="vTitle"></div>
  <div class="toast" id="toast" role="status"></div>

  <script src="assets/js/n8n.js"></script>
  <script src="assets/js/site.js"></script>
</body>
</html>
