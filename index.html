<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Design Prompts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<!-- All content (styles, images, videos, site name, colours) lives in data/site-data.js -->
<script>document.write('<script src="data/site-data.js?v=' + Date.now() + '"><\/script>');</script>
</head>
<body data-page="images">
  <aside class="sidebar" id="sidebar">
    <a class="brand" href="index.html"><span class="brand-mark" id="brandMark"></span><span class="brand-name" id="brandName"></span></a>
    <nav class="nav" id="mainNav" aria-label="Main"></nav>
    <div>
      <p class="nav-title">Design styles</p>
      <nav class="style-nav" id="styleNav" aria-label="Design styles"></nav>
    </div>
    <div class="sidebar-foot" id="sideFoot"></div>
  </aside>

  <div class="shell">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="menuBtn" aria-label="Open menu">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <label class="search">
        <span class="sr-only">Search prompts</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Search prompts, styles, tags">
      </label>
      <span class="spacer"></span>
      <button class="icon-btn" id="themeBtn" aria-label="Switch light or dark mode">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </header>

    <main>
      <section class="intro"><h1 id="heroTitle"></h1><p id="heroText"></p></section>
      <div class="chips" id="chips" role="toolbar" aria-label="Filter by style"></div>
      <div id="stylePanel"></div>
      <div id="content"></div>
      <footer class="site-footer" id="footer"></footer>
    </main>
  </div>

  <div class="modal" id="modal" hidden>
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="mTitle">
      <button class="icon-btn close-btn" id="mClose" aria-label="Close">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
      <div class="modal-media" id="mMedia"></div>
      <div class="modal-info" id="mInfo"></div>
    </div>
  </div>
  <div class="toast" id="toast" role="status"></div>
  <script src="assets/js/site.js"></script>
</body>
</html>
